name: FinalTake CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]


jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_only_password
          MYSQL_DATABASE: finaltake_ci_test
          MYSQL_USER: finaltake_ci
          MYSQL_PASSWORD: ci_test_only_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      RUN_MYSQL_INTEGRATION_TESTS: "1"
      DB_HOST: "127.0.0.1"
      DB_USER: "finaltake_ci"
      DB_PASSWORD: "ci_test_only_password"
      DB_NAME: "finaltake_ci_test"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Generate build version
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          BUILD_VERSION="build-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          echo "BUILD_VERSION=${BUILD_VERSION}" >> "$GITHUB_ENV"
          echo "Build version: ${BUILD_VERSION}"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: |
          echo "Running backend tests for ${BUILD_VERSION}"
          python -m unittest discover -s . -p "test_*.py" -v

      - name: Run repository tests
        working-directory: .
        run: |
          if [ -d "tests" ]; then
            echo "Running repository tests for ${BUILD_VERSION}"
            python -m unittest discover -s tests -p "test_*.py" -v
          else
            echo "No repository-level tests directory yet."
          fi
      
      - name: Package application
        run: |
          cd ..
          zip -r "${BUILD_VERSION}.zip" \
            backend \
            frontend \
            README.md \
            -x "backend/venv/*" \
            -x "backend/__pycache__/*" \
            -x "*.DS_Store"

      - name: Validate build package
        run: |
          cd ..
          python -m compileall -q backend

          for required in backend/app.py backend/requirements.txt frontend/index.html README.md; do
            if ! unzip -Z1 "${BUILD_VERSION}.zip" | grep -Fx -- "${required}" > /dev/null; then
              echo "Build package is missing ${required}"
              exit 1
            fi
          done

          echo "Build package ${BUILD_VERSION}.zip validated."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_VERSION }}
          path: ${{ env.BUILD_VERSION }}.zip

  # Frontend/UX CI validation
  frontend-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate frontend files
        run: |
          echo "Validating FinalTake frontend..."

          test -f frontend/index.html
          test -f frontend/pages/login.html
          test -f frontend/pages/signup.html
          test -f frontend/css/style.css
          test -f frontend/js/app.js

          echo "Frontend validation passed."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate search JavaScript syntax
        run: node --check frontend/js/app.js

      - name: Run frontend API recovery integration test
        run: node --test tests/search_integration.test.mjs

      - name: Run media details regression tests
        run: node --test tests/media_details.test.mjs

  # Single required check: fails if any CI job failed, was cancelled, or was skipped.
  ci-status:
    name: CI status
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-validation]
    if: always()

    steps:
      - name: Report job results
        run: |
          echo "backend-tests: ${{ needs.backend-tests.result }}"
          echo "frontend-validation: ${{ needs.frontend-validation.result }}"

      - name: Fail unless every job succeeded
        run: |
          test "${{ needs.backend-tests.result }}" = "success"
          test "${{ needs.frontend-validation.result }}" = "success"