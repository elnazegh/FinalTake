name: FinalTake CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Generate build version
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          BUILD_VERSION="build-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          echo "BUILD_VERSION=${BUILD_VERSION}" >> "$GITHUB_ENV"
          echo "Build version: ${BUILD_VERSION}"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: |
          echo "Running backend tests for ${BUILD_VERSION}"
          python -m unittest discover -s . -p "test_*.py" -v

      - name: Run repository tests
        working-directory: .
        run: |
          if [ -d "tests" ]; then
            echo "Running repository tests for ${BUILD_VERSION}"
            python -m unittest discover -s tests -p "test_*.py" -v
          else
            echo "No repository-level tests directory yet."
          fi
      
      - name: Package application
        run: |
          cd ..
          zip -r "${BUILD_VERSION}.zip" \
            backend \
            frontend \
            README.md \
            -x "backend/venv/*" \
            -x "backend/__pycache__/*" \
            -x "*.DS_Store"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_VERSION }}
          path: ${{ env.BUILD_VERSION }}.zip


 # Frontend/UX CI validation - Sprint 2
  frontend-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4


 # Validate required frontend files
      - name: Validate frontend files
        run: |
          echo "Validating FinalTake frontend..."

          test -f frontend/index.html
          test -f frontend/pages/login.html
          test -f frontend/pages/signup.html
          test -f frontend/css/style.css
          test -f frontend/js/app.js

          echo "Frontend validation passed."