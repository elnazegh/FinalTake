
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Comments | FinalTake</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>
  <header class="site-header">
    <div class="logo">
      <a href="../index.html">FinalTake</a>
    </div>
  </header>

  <main class="auth-page">
    <section class="auth-card">
      <a href="../index.html">← Back to Home</a>

      <h1>Review Comments</h1>
      <p>Read and discuss a review.</p>

      <section aria-labelledby="comments-heading">
        <h2 id="comments-heading">Comments</h2>

        <p id="comments-message" role="status"
           aria-live="polite"></p>

        <div id="comments-list"></div>
      </section>

      <section aria-labelledby="add-comment-heading">
        <h2 id="add-comment-heading">Add a Comment</h2>

        <form id="comment-form">
          <label for="comment-text">Your Comment</label>

          <textarea
            id="comment-text"
            rows="4"
            required
            placeholder="Write your comment..."
          ></textarea>

          <button type="submit">Post Comment</button>
        </form>
      </section>
    </section>
  </main>

  <script src="../js/comments-ui.js"></script>
</body>
</html>
