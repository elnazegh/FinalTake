<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - FinalTake</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <header class="site-header">
    <div class="logo">
      <a href="../index.html">FinalTake</a>
    </div>

    <nav class="main-nav" aria-label="Main navigation">
      <a href="../index.html">Home</a>
      <a href="#">Movies</a>
      <a href="#">TV Shows</a>
      <a href="#">Books</a>
      <a href="#">Games</a>
    </nav>

    <div class="header-actions">
      <a href="login.html" class="login-link">Log In</a>
      <a href="signup.html" class="signup-button">Sign Up</a>
    </div>
  </header>

  <main class="auth-page">

    <div class="auth-card">
      <h2>Create Account</h2>
      <p>Join FinalTake and start sharing your opinions.</p>

      <form id="signup-form">

        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Choose a username"
          autocomplete="username"
          minlength="3"
          required
        >

        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Create a password"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <p class="password-hint">
          Password must be at least 8 characters.
        </p>

        <label for="confirm-password">Confirm Password</label>
        <input
          type="password"
          id="confirm-password"
          name="confirm-password"
          placeholder="Confirm your password"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <div class="signup-options">
          <label class="terms-option">
            <input type="checkbox" id="terms" required>
            <span>I agree to the Terms and Privacy Policy</span>
          </label>
        </div>

        <button type="submit">Create Account</button>

      </form>

      <div class="auth-links">
        <p>
          Already have an account?
          <a href="login.html">Log In</a>
        </p>
      </div>
    </div>

  </main>

  <footer>
    <p>&copy; 2026 FinalTake</p>
  </footer>

</body>
</html>
