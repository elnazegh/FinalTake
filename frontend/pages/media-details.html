<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Details | FinalTake</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>
  <header class="site-header">
    <div class="logo">
      <a href="../index.html">FinalTake</a>
    </div>
  </header>

<main class="auth-page media-details-page">
<section class="auth-card media-details-card">
   <a href="../index.html" class="back-to-media-button">
      Back to Search
    </a>

    <div id="media-details">
      <p>Loading media details...</p>
    </div>

<a
  id="write-review-link"
  class="btn"
  href="#"
>
  Write a Review
</a>


<script>
  (() => {
    const selectedMediaId = new URLSearchParams(
      window.location.search
    ).get("id");

    const reviewLink = document.getElementById("write-review-link");

    if (reviewLink && selectedMediaId) {
      reviewLink.href =
        `review-form-demo.html?id=${encodeURIComponent(selectedMediaId)}`;
      reviewLink.hidden = false;
    } else if (reviewLink) {
      reviewLink.hidden = true;
    }
  })();
</script>

<section id="reviews-section" aria-labelledby="reviews-heading">
  <h2 id="reviews-heading">Reviews</h2>

  <p id="reviews-message" role="status">
    Loading reviews...
  </p>

  <div id="reviews-list"></div>
</section>

    </section>
  </main>

  <script src="../js/media-details.js"></script>
  <script src="../js/reviews-ui.js"></script>
</body>
</html>
